<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嘘つきサイコロ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5efff;--ink:#514264;--pink:#ffb8d2;--blue:#a9d9ff;--purple:#c9b4ff;--card:#fffaff;--line:#e7dafa;--shadow:0 8px 25px #76639a20}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0,transparent 28%),linear-gradient(145deg,#f4edff,#e8f7ff);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;padding:18px}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,#bca9ff,#91d5ff);color:#42365c;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#fff;border:1px solid var(--line)}
button.danger{background:#ffd1df}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}
h1,h2,p{margin-top:0}
h1{font-size:clamp(27px,6vw,42px)}
.wrap{max-width:900px;margin:auto}
header{text-align:center;padding:14px 0 20px}
.logo{font-size:50px}
.panel{background:#ffffffdf;border:1px solid #fff;border-radius:22px;padding:20px;box-shadow:var(--shadow);margin:12px 0}
.center{text-align:center}
.small{font-size:13px;opacity:.75}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.stack{display:grid;gap:12px}
.hidden{display:none!important}
.code{font-size:28px;letter-spacing:7px;font-weight:900;background:#f3edff;border-radius:14px;padding:12px}
.status{padding:10px;background:#f4efff;border-radius:13px}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:14px 0}
.tile{min-height:64px;border-radius:13px;background:linear-gradient(145deg,#d9f3ff,#f4eaff);border:1px solid #fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px}
.tile:nth-child(3n){background:linear-gradient(145deg,#ffe4f0,#f5eaff)}
.tile.goal{background:linear-gradient(145deg,#ffe9a8,#ffc8de)}
.tokens{font-size:20px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{padding:12px;border-radius:15px;background:#f7f2ff;border:2px solid transparent}
.player.active{border-color:#b49cff}
.player strong{display:block}
.dice{font-size:68px;line-height:1.25;margin:8px}
.action-area{display:grid;gap:10px}
.action-area button{width:100%;min-height:48px}
.timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:#e8f5ff;font-size:12px;font-weight:800}
footer{text-align:center;padding:20px;font-size:12px;opacity:.6}
@media(min-width:650px){.board{grid-template-columns:repeat(8,minmax(0,1fr))}.tile{min-height:76px}.game-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:start}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg) scale(1.08)}75%{transform:rotate(13deg) scale(1.08)}}
.rolling{animation:wobble .18s infinite}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">🏝️🎲</div><h1>嘘つきサイコロ</h1><p>サイコロの目を宣言して、相手を見抜こう！</p></header>
<section id="loginPanel" class="panel stack">
<h2 class="center">あそびにいこう！</h2>
<label>プレイヤー名<input id="playerName" maxlength="12" placeholder="なまえを入力"></label>
<button id="randomBtn">🎲 ランダムマッチ</button>
<button id="createBtn" class="secondary">🏝️ 部屋をつくる</button>
<div class="row"><input id="roomCode" maxlength="8" placeholder="部屋コード"><button id="joinBtn">参加する</button></div>
<p id="loginMessage" class="small center">オンライン対戦・2人用</p>
</section>
<section id="waitingPanel" class="panel center hidden">
<h2>相手を待っています…</h2>
<p>この部屋のコードを友だちに教えてね</p>
<div id="roomCodeDisplay" class="code">------</div>
<button id="copyCodeBtn" class="secondary">コードをコピー</button>
<p id="waitingMessage" class="small">相手が参加するとゲームが始まります</p>
<button id="cancelWaitBtn" class="secondary">タイトルへ戻る</button>
</section>
<section id="gamePanel" class="hidden">
<div class="panel center">
<div class="row"><div><span class="badge" id="phaseBadge">準備中</span></div><div><span class="badge" id="roomBadge">ROOM</span></div></div>
<h2 id="message">ゲーム準備中</h2>
<div class="timer" id="timer">--</div><p class="small" id="timerLabel">残り時間</p>
</div>
<div class="game-grid">
<div class="panel">
<h2 class="center">🌊 島めぐりマップ</h2>
<div id="board" class="board"></div>
<div class="players">
<div id="player0" class="player"><strong id="name0">プレイヤー1</strong><span id="pos0">0 / 30 マス</span></div>
<div id="player1" class="player"><strong id="name1">プレイヤー2</strong><span id="pos1">0 / 30 マス</span></div>
</div>
</div>
<div class="panel center">
<h2 id="turnTitle">ゲーム操作</h2>
<div id="dice" class="dice">🎲</div>
<p id="subMessage" class="small">画面の案内に従ってね</p>
<div id="setupArea" class="action-area hidden"><button id="setupRollBtn">🎲 先攻・後攻サイコロを振る</button></div>
<div id="rollArea" class="action-area hidden"><button id="rollBtn">🎲 サイコロを振る</button></div>
<div id="declareArea" class="action-area hidden">
<p>出た目を宣言してね</p>
<div class="row"><button data-claim="1">1</button><button data-claim="2">2</button><button data-claim="3">3</button></div>
<div class="row"><button data-claim="4">4</button><button data-claim="5">5</button><button data-claim="6">6</button></div>
</div>
<div id="challengeArea" class="action-area hidden">
<p>相手の宣言をどうする？</p>
<button id="believeBtn">信じる</button>
<button id="doubtBtn" class="danger">ダウト！</button>
</div>
<p id="privateInfo" class="small"></p>
<button id="backBtn" class="secondary">タイトルへ戻る</button>
</div>
</div>
</section>
<footer>嘘つきサイコロ · 2人であそぼう</footer>
</div>
<script>
(()=>{
"use strict";
const SUPABASE_URL="https://pggwvveeprbnowrarbff.supabase.co";
const SUPABASE_KEY="sb_publishable_zk1iWPtsHN8GkWIDRHeLrw_Yr9iMZWT";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const ROOM_KEY="usotsuki_room_id";
const ICONS=["🐰","🐻"];
const FACES=["","⚀","⚁","⚂","⚃","⚄","⚅"];
let user=null,room=null,myIndex=-1,game=null,ownRoll=null,ownSetupRoll=null;
let channel=null,poller=null,ticker=null,busy=false,lastSetupAttempt=-1,autoTieAttempt=-1;
function say(id,msg){$(id).textContent=msg}
function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function name(){return ($("playerName").value.trim()||"プレイヤー").slice(0,12)}
function initialGame(n){return {players:[n,"プレイヤー2"],pos:[0,0],turn:0,phase:"waiting",real:null,claim:null,claimant:null,finished:false,winner:null,message:"相手の参加を待っています",deadline:null}}
function setLoginMessage(m){say("loginMessage",m)}
function setBusy(v){busy=v;["randomBtn","createBtn","joinBtn","setupRollBtn","rollBtn","believeBtn","doubtBtn"].forEach(id=>{if($(id))$(id).disabled=v})}
async function ensureLogin(){
const {data,error}=await db.auth.getSession();if(error)throw error;
if(data.session){user=data.session.user;return}
const result=await db.auth.signInAnonymously();if(result.error)throw result.error;user=result.data.user;
}
async function start(){
try{await ensureLogin();const saved=localStorage.getItem(ROOM_KEY);if(saved)await restoreRoom(saved)}
catch(e){setLoginMessage("接続エラー："+e.message)}
}
async function restoreRoom(id){
const {data,error}=await db.from("game_rooms").select("*").eq("id",id).maybeSingle();
if(error||!data){localStorage.removeItem(ROOM_KEY);return}
room=data;myIndex=room.host_id===user.id?0:room.guest_id===user.id?1:-1;
if(myIndex<0){localStorage.removeItem(ROOM_KEY);return}
if(room.status==="waiting"){showWaiting();startSync()}
else if(["playing","finished"].includes(room.status)){receive(room);startSync();await loadOwnSecret()}
}
async function createRoom(){
if(busy)return;setBusy(true);
try{
await ensureLogin();
const code=Math.random().toString(36).slice(2,8).toUpperCase();
const {data,error}=await db.from("game_rooms").insert({code,host_id:user.id,status:"waiting",game_state:initialGame(name())}).select("*").single();
if(error)throw error;room=data;myIndex=0;localStorage.setItem(ROOM_KEY,room.id);showWaiting();startSync();
}catch(e){setLoginMessage("部屋を作れませんでした："+e.message)}
finally{setBusy(false)}
}
async function joinByCode(){
if(busy)return;setBusy(true);
try{
await ensureLogin();const code=$("roomCode").value.trim().toUpperCase();
if(!code)throw new Error("部屋コードを入力してね");
const {data,error}=await db.rpc("join_room_by_code",{p_code:code,p_player_name:name()});
if(error)throw error;room=Array.isArray(data)?data[0]:data;if(!room)throw new Error("部屋が見つかりません");
myIndex=1;localStorage.setItem(ROOM_KEY,room.id);receive(room);startSync();await loadOwnSecret();
}catch(e){setLoginMessage("参加できませんでした："+e.message)}
finally{setBusy(false)}
}
async function randomMatch(){
if(busy)return;setBusy(true);
try{
await ensureLogin();const {data,error}=await db.rpc("join_random_room",{p_player_name:name()});
if(error)throw error;room=Array.isArray(data)?data[0]:data;if(!room)throw new Error("マッチングできませんでした");
myIndex=room.host_id===user.id?0:1;localStorage.setItem(ROOM_KEY,room.id);
if(room.status==="waiting")showWaiting();else{receive(room);await loadOwnSecret()}
startSync();
}catch(e){setLoginMessage("ランダムマッチに失敗："+e.message)}
finally{setBusy(false)}
}
function showWaiting(){hide("loginPanel");hide("gamePanel");show("waitingPanel");say("roomCodeDisplay",room.code||"------")}
function showGame(){hide("loginPanel");hide("waitingPanel");show("gamePanel")}
function startSync(){
if(!room)return;
if(channel){db.removeChannel(channel);channel=null}
channel=db.channel("room-"+room.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_rooms",filter:"id=eq."+room.id},p=>receive(p.new)).subscribe();
if(poller)clearInterval(poller);poller=setInterval(refresh,1200);
if(ticker)clearInterval(ticker);ticker=setInterval(tick,250);
}
async function refresh(){
if(!room)return;const {data,error}=await db.from("game_rooms").select("*").eq("id",room.id).maybeSingle();if(!error&&data)receive(data);
}
function receive(row){
if(!row)return;room=row;
if(row.host_id===user.id)myIndex=0;else if(row.guest_id===user.id)myIndex=1;
if(row.status==="waiting"){showWaiting();return}
if(row.status==="playing"||row.status==="finished"){game=row.game_state||{};showGame();render()}
}
async function loadOwnSecret(){
if(!room)return;const {data,error}=await db.from("game_secrets").select("real_roll").eq("room_id",room.id).maybeSingle();if(!error&&data)ownRoll=data.real_roll;
}
async function submitSetupRoll(){
if(busy||!game||game.phase!=="setup")return;
const attempt=Number(game.setupAttempt||0);if(lastSetupAttempt===attempt)return;
setBusy(true);const roll=1+Math.floor(Math.random()*6);ownSetupRoll=roll;say("dice",FACES[roll]);$("dice").classList.add("rolling");
await new Promise(r=>setTimeout(r,650));$("dice").classList.remove("rolling");
try{
const {data,error}=await db.rpc("submit_start_roll",{p_room_id:room.id,p_roll:roll});if(error)throw error;
lastSetupAttempt=attempt;
if(data?.status==="waiting")say("subMessage","相手のサイコロを待っています…");
if(data?.status==="tie")say("subMessage","同じ目！もう一度勝負！");
if(data?.state)game=data.state;await refresh();
}catch(e){say("subMessage","サイコロに失敗："+e.message);lastSetupAttempt=-1}
finally{setBusy(false);render()}
}
function scheduleTieReroll(){
const a=Number(game.setupAttempt||0);
if(Array.isArray(game.setupRolls)&&autoTieAttempt!==a){
autoTieAttempt=a;setTimeout(()=>{if(game&&game.phase==="setup"&&Number(game.setupAttempt||0)===a){lastSetupAttempt=-1;ownSetupRoll=null;render()}},1300);
}
}
async function doAction(action,value=null){
if(busy)return;setBusy(true);
try{
const {data,error}=await db.rpc("game_action",{p_room_id:room.id,p_action:action,p_value:value});if(error)throw error;
if(data?.state)game=data.state;if(action==="roll")await loadOwnSecret();await refresh();
}catch(e){say("subMessage","操作できませんでした："+e.message)}
finally{setBusy(false);render()}
}
function renderBoard(){
const board=$("board");board.innerHTML="";const pos=Array.isArray(game.pos)?game.pos:[0,0];
for(let i=0;i<31;i++){
const tile=document.createElement("div");tile.className="tile"+(i===30?" goal":"");
const tokens=[];pos.forEach((p,index)=>{if(Math.max(0,Math.min(30,Number(p)||0))===i)tokens.push(ICONS[index])});
const num=document.createElement("span");num.className="small";num.textContent=i+1;
const token=document.createElement("span");token.className="tokens";token.textContent=tokens.join("");
const place=document.createElement("span");place.textContent=i===30?"🏆 ゴール":["🏝️","🌴","🐚","🌺","🪸","🌊"][i%6];
tile.append(num,token,place);board.appendChild(tile);
}
}
function render(){
if(!game)return;
const players=Array.isArray(game.players)?game.players:["プレイヤー1","プレイヤー2"];
const pos=Array.isArray(game.pos)?game.pos:[0,0];
say("name0",players[0]||"プレイヤー1");say("name1",players[1]||"プレイヤー2");
say("pos0",(pos[0]||0)+" / 30 マス");say("pos1",(pos[1]||0)+" / 30 マス");
$("player0").classList.toggle("active",Number(game.turn)===0&&!game.finished);
$("player1").classList.toggle("active",Number(game.turn)===1&&!game.finished);
renderBoard();say("roomBadge","ROOM "+(room?.code||""));say("message",game.message||"ゲーム中");
const phase=game.phase||"waiting";
const labels={setup:"先攻・後攻決め",roll:"サイコロ",declare:"目を宣言",challenge:"ダウト判定",waiting:"相手待ち"};
say("phaseBadge",game.finished?"ゲーム終了":(labels[phase]||phase));
say("turnTitle",game.finished?"ゲーム終了":(Number(game.turn)===myIndex?"あなたの番":"相手の番"));
["setupArea","rollArea","declareArea","challengeArea"].forEach(hide);
const startAt=Number(game.startReadyAt||0),startPending=phase==="roll"&&startAt>Date.now();
const myTurn=Number(game.turn)===myIndex;
const isChallenger=phase==="challenge"&&Number(game.claimant)!==myIndex;
if(game.finished){say("subMessage",Number(game.winner)===myIndex?"🎉 あなたの勝ち！":"ゲーム終了！");say("dice","🏆");hide("privateInfo")}
else if(phase==="setup"){
show("setupArea");const a=Number(game.setupAttempt||0);const pair=Array.isArray(game.setupRolls)?game.setupRolls:null;
const ownShown=lastSetupAttempt===a&&ownSetupRoll;
say("dice",ownShown?FACES[ownSetupRoll]:(pair?pair.map(n=>FACES[n]||"🎲").join("  "):"🎲"));
say("subMessage",pair?"同じ目！次の勝負の準備中":(ownShown?"相手の結果を待っています":"先攻・後攻を決めよう"));
$("setupRollBtn").disabled=busy||lastSetupAttempt===a;if(pair)scheduleTieReroll();
}else if(startPending){say("dice","🎲");say("subMessage","ゲーム開始の準備中…")}
else if(phase==="roll"){say("dice",ownRoll?FACES[ownRoll]:"🎲");if(myTurn)show("rollArea");say("subMessage",myTurn?"サイコロを振ってね":"相手がサイコロを振っています")}
else if(phase==="declare"){say("dice",myTurn&&ownRoll?FACES[ownRoll]:"🎲");if(myTurn)show("declareArea");say("subMessage",myTurn?"出た目を宣言してね":"相手の宣言を待っています")}
else if(phase==="challenge"){say("dice",FACES[Number(game.claim)||0]||"🎲");if(isChallenger)show("challengeArea");say("subMessage",isChallenger?"相手の宣言を信じる？ダウトする？":"相手が判断しています")}
if(game.finished)hide("privateInfo");
else if(phase==="declare"&&myTurn)say("privateInfo","あなたの本当の目："+(ownRoll?FACES[ownRoll]:"確認中"));
else say("privateInfo","");
tick();
}
function tick(){
if(!game||!room)return;const now=Date.now();
if(game.finished){say("timer","終了");say("timerLabel","");return}
if(game.phase==="setup"){
const found=Number(game.matchFoundAt||0);const ready=found?Math.max(0,Math.ceil((found+3000-now)/1000)):0;
say("timer",ready>0?ready+"秒":"GO!");say("timerLabel",ready>0?"先攻決め開始まで":"先攻・後攻を決めてね");return;
}
const startAt=Number(game.startReadyAt||0);
if(game.phase==="roll"&&startAt>now){say("timer",Math.ceil((startAt-now)/1000)+"秒");say("timerLabel","ゲーム開始まで");return}
const deadline=Number(game.deadline||0);if(!deadline){say("timer","--");say("timerLabel","");return}
const left=Math.max(0,Math.ceil((deadline-now)/1000));say("timer",left+"秒");say("timerLabel","残り時間");
if(left===0&&!busy&&!game.finished)doAction("timeout");
}
function backToTitle(){
if(poller)clearInterval(poller);if(ticker)clearInterval(ticker);if(channel)db.removeChannel(channel);
channel=null;poller=null;ticker=null;room=null;game=null;myIndex=-1;ownRoll=null;ownSetupRoll=null;lastSetupAttempt=-1;
localStorage.removeItem(ROOM_KEY);hide("gamePanel");hide("waitingPanel");show("loginPanel");setLoginMessage("オンライン対戦・2人用");
}
$("createBtn").addEventListener("click",createRoom);
$("joinBtn").addEventListener("click",joinByCode);
$("randomBtn").addEventListener("click",randomMatch);
$("setupRollBtn").addEventListener("click",submitSetupRoll);
$("rollBtn").addEventListener("click",()=>doAction("roll"));
$("believeBtn").addEventListener("click",()=>doAction("believe"));
$("doubtBtn").addEventListener("click",()=>doAction("doubt"));
$("backBtn").addEventListener("click",backToTitle);
$("cancelWaitBtn").addEventListener("click",backToTitle);
$("copyCodeBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(room.code);say("waitingMessage","コードをコピーしたよ！")}catch(e){say("waitingMessage","コード："+room.code)}});
document.querySelectorAll("[data-claim]").forEach(b=>b.addEventListener("click",()=>doAction("declare",Number(b.dataset.claim))));
start();
})();
</script>
</body>
</html>
