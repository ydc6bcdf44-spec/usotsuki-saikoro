<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Island Adventure 管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf5ef;color:#254b48;font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:18px}section{background:white;border:1px solid #d7e4dc;border-radius:12px;padding:18px;margin-bottom:16px}button,input{font:inherit;padding:11px;border-radius:8px;border:1px solid #a3c0b3}button{background:#32796e;color:white;cursor:pointer}input{width:100%;margin:5px 0 12px}label{display:block}#login{max-width:420px;margin:40px auto}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.metric{padding:14px;background:#f1f8f3;border-radius:8px}.metric strong{display:block;font-size:27px;margin-top:6px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h1{flex:1}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:11px;border-bottom:1px solid #e1eae4;font-size:13px}th{background:#f1f8f3}.tablewrap{overflow:auto}.muted{color:#657e76;font-size:12px}.hidden{display:none!important}#error{color:#a34242;overflow-wrap:anywhere}</style></head><body><main><div class="top"><h1>Island Adventure 管理</h1><button id="logout" class="hidden">ログアウト</button></div><p id="error" role="alert"></p><section id="login"><h2>管理者ログイン</h2><form id="form"><label>メールアドレス<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">ログイン</button></form></section><div id="dashboard" class="hidden"><section><div class="top"><h2>アクセス状況</h2><button id="refresh">更新</button></div><p class="muted" id="updated"></p><div id="metrics" class="metrics"></div><p class="muted">オンラインは直近90秒以内の通信を基準とした概算。アクセスは計測開始後のページ訪問単位。日付は日本時間。ルーム数は保存されている状態を集計。</p></section><section><h2>プレイヤー一覧</h2><input id="search" placeholder="名前・ユーザーIDで検索"><p class="muted">最大500アカウント。匿名アカウントは同一人物でも別端末・ブラウザで重複する場合があります。</p><div class="tablewrap"><table><thead><tr><th>名前</th><th>状態</th><th>端末</th><th>最終アクセス</th><th>初回登録</th><th>最終ログイン</th><th>対戦</th><th>勝利</th><th>敗北</th><th>勝率</th><th>ID</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>const SUPABASE_URL="https://pggwvveeprbnowrarbff.supabase.co";
const SUPABASE_KEY="sb_publishable_zk1iWPtsHN8GkWIDRHeLrw_Yr9iMZWT";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"island-owner-auth",detectSessionInUrl:false}}),$=id=>document.getElementById(id);let data=null,timer=null,epoch=0;
const show=(id,on)=>$(id).classList.toggle("hidden",!on);
function reset(){epoch++;clearInterval(timer);timer=null;data=null;$("metrics").replaceChildren();$("rows").replaceChildren();show("dashboard",false);show("logout",false);show("login",true)}
const date=v=>v?new Date(v).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"}):"—";
function renderRows(){const q=$("search").value.toLowerCase();$("rows").replaceChildren();for(const p of data?.players||[]){if(!((p.player_name||"")+" "+p.id).toLowerCase().includes(q))continue;const tr=document.createElement("tr");for(const v of [p.player_name||"未入力",p.last_seen&&Date.now()-Date.parse(p.last_seen)<90000?"オンライン":"オフライン",p.device==="mobile"?"スマホ":p.device==="desktop"?"PC":"—",date(p.last_seen),date(p.created_at),date(p.last_sign_in_at),p.games_played,p.wins,p.losses,p.games_played?Math.round(p.wins/p.games_played*100)+"%":"—",p.id]){const td=document.createElement("td");td.textContent=String(v??"—");tr.append(td)}$("rows").append(tr)}}
async function load(){const ticket=epoch;const {data:d,error}=await db.rpc("island_admin_overview");if(ticket!==epoch)return false;if(error){reset();$("error").textContent="管理データを取得できません："+error.message;await db.auth.signOut({scope:"local"});return false}data=d;$("error").textContent="";show("login",false);show("dashboard",true);show("logout",true);$("updated").textContent="最終更新："+date(new Date());$("metrics").replaceChildren();const total=d.mobile+d.desktop;for(const [label,value] of [["登録アカウント",d.accounts],["オンライン",d.online],["今日の利用者",d.today_users],["今日の訪問",d.today_visits],["累計訪問",d.total_visits],["スマホ割合",total?Math.round(d.mobile/total*100)+"%":"—"],["PC割合",total?Math.round(d.desktop/total*100)+"%":"—"],["待機ルーム",d.waiting],["対戦中ルーム",d.playing]]){const box=document.createElement("div"),strong=document.createElement("strong");box.className="metric";box.textContent=label;strong.textContent=value;box.append(strong);$("metrics").append(box)}renderRows();return true}
async function start(){if(await load()){clearInterval(timer);timer=setInterval(load,30000)}}
$("form").onsubmit=async e=>{e.preventDefault();$("error").textContent="";const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("password").value="";if(error){$("error").textContent="ログインできませんでした。";return}await start()};
$("logout").onclick=async()=>{reset();await db.auth.signOut({scope:"local"});$("error").textContent=""};$("refresh").onclick=load;$("search").oninput=renderRows;db.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
